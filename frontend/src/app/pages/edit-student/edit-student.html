<a class="back" routerLink="/">← Home</a>
<div class="card">
  <h2>Edit Student Data</h2>
  <div class="row">
    <div>
      <label for="sid">Student ID</label>
      <input id="sid" type="number" min="1" [(ngModel)]="searchId" name="searchId" (keyup.enter)="search()" />
    </div>
    <button type="button" (click)="search()">Search</button>
  </div>

  @if (student(); as student) {
    <form #f="ngForm" (ngSubmit)="save(f)" novalidate>
      <label for="name">Student name</label>
      <input id="name" type="text" name="studentName" [(ngModel)]="student.studentName" required maxlength="100" #n="ngModel" />
      @if (n.invalid && (n.touched || f.submitted)) { <div class="field-error">Student name is required</div> }

      <label for="town">Hometown</label>
      <input id="town" type="text" name="homeTown" [(ngModel)]="student.homeTown" required maxlength="100" #t="ngModel" />
      @if (t.invalid && (t.touched || f.submitted)) { <div class="field-error">Hometown is required</div> }

      <label class="checkbox"><input type="checkbox" name="isActive" [(ngModel)]="student.isActive" /> Active</label>
      <button type="submit">Update Student</button>
    </form>
  }
  <app-alert [text]="message()" [isError]="isError()" />
</div>
